<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>Moonframe component behavior fixture</title></head>
  <body><div id="root"></div>
    <script type="module">
      import React from 'react';
      import { createRoot } from 'react-dom/client';
      import {
        Button, Checkbox, Switch, Tabs, Dialog, Accordion, Input, Select,
        Field, RadioGroup, DropdownMenu, Popover, Tooltip, DataTable,
      } from '../src/components.js';
      import '../src/styles.css';
      const h = React.createElement;
      function Fixture() {
        const [open, setOpen] = React.useState(false);
        const [checked, setChecked] = React.useState(false);
        const [enabled, setEnabled] = React.useState(false);
        const [menuChoice, setMenuChoice] = React.useState('none');
        return h('main', {'data-skin':'classic', 'data-mode':'light'},
          h('h1', null, 'Components'),
          new URLSearchParams(location.search).has('initial') && h(Dialog, {title:'Initially open',defaultOpen:true}, 'Initial modal content'),
          h(Dialog, {title:'Create workspace', description:'Enter a workspace name', trigger:h(Button, null, 'Open dialog')}, h(Input, {'aria-label':'Workspace name'}), h(Button, null, 'Save')),
          h(Button, {onClick:()=>setOpen(true)}, 'Open controlled'),
          h(Dialog, {title:'Controlled dialog', open, onOpenChange:setOpen}, h(Button, {onClick:()=>setOpen(false)}, 'Done')),
          h(Tabs, {label:'Workspace sections', items:[{value:'overview',label:'Overview',content:'Overview content'}, {value:'disabled',label:'Disabled',content:'Disabled content',disabled:true}, {value:'activity',label:'Activity',content:'Activity content'}, {value:'settings',label:'Settings',content:'Settings content'}]}),
          h('div', {dir:'rtl'}, h(Tabs, {label:'RTL sections', items:[{value:'first',label:'RTL first',content:'First RTL content'}, {value:'second',label:'RTL second',content:'Second RTL content'}]})),
          h(Accordion, {items:[{value:'first',title:'First disclosure',content:'First disclosure content'}, {value:'second',title:'Second disclosure',content:'Second disclosure content'}]}),
          h(Checkbox, {label:'Email updates'}), h(Switch, {label:'Notifications'}), h(Checkbox, {label:'Disabled checkbox',disabled:true}),
          h(Checkbox, {label:'Controlled checkbox',checked,onChange:event=>setChecked(event.currentTarget.checked)}),
          h(Switch, {label:'Controlled switch',checked:enabled,onChange:event=>setEnabled(event.currentTarget.checked)}),
          h(Switch, {label:'Disabled switch',disabled:true}),
          h(Select, {'aria-label':'Country',defaultValue:'id'},h('option',{value:'id'},'Indonesia'),h('option',{value:'my'},'Malaysia')),
          h(Button, {asChild:true, variant:'secondary'}, h('a', {href:'#next-route'}, 'Next Route Link')),
          h(Field, {label:'Project slug', description:'Lowercase identifier', error:'Slug already in use', required:true}, h(Input, {defaultValue:'moonframe'})),
          h(RadioGroup, {label:'Deployment tier', defaultValue:'hobby', items:[{value:'hobby',label:'Hobby'},{value:'enterprise',label:'Enterprise'}]}),
          h(DropdownMenu, {
            label:'Project actions',
            trigger:h(Button, null, 'Open menu'),
            items:[
              {value:'duplicate', label:'Duplicate project', onSelect:v=>setMenuChoice(v)},
              {value:'archive', label:'Archive project', onSelect:v=>setMenuChoice(v)},
            ],
          }),
          h('output', {'aria-label':'Menu selection'}, menuChoice),
          h(Popover, {title:'Quick help', trigger:h(Button, null, 'Open popover')}, h('p', null, 'Popover body copy')),
          h(Tooltip, {content:'Keyboard shortcut Ctrl+K'}, h(Button, null, 'Shortcut trigger')),
          h(DataTable, {
            caption:'Deployments table',
            searchable:true,
            searchPlaceholder:'Filter deployments',
            columns:[
              {key:'service', header:'Service', sortable:true},
              {key:'region', header:'Region'},
            ],
            data:[
              {id:'1', service:'Zulu API', region:'sin1'},
              {id:'2', service:'Alpha Web', region:'iad1'},
            ],
          })
        );
      }
      createRoot(document.getElementById('root')).render(h(React.StrictMode, null, h(Fixture)));
    </script>
  </body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Abstract stage floodlights</title>
  <desc id="desc">Original geometric beams of light cross a dark stage backdrop.</desc>
  <defs>
    <linearGradient id="beam-a" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7df72" stop-opacity=".42"/>
      <stop offset="1" stop-color="#f7df72" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beam-b" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78d8e8" stop-opacity=".34"/>
      <stop offset="1" stop-color="#78d8e8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="floor-glow">
      <stop stop-color="#dd6689" stop-opacity=".3"/>
      <stop offset="1" stop-color="#dd6689" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <path fill="#15131b" d="M0 0h1200v900H0z"/>

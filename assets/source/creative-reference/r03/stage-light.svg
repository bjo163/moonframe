  <path fill="#28232c" d="M0 790q220-42 420 0t390 0 390 0v110H0z"/>
  <path fill="none" stroke="#f7df72" stroke-opacity=".55" stroke-width="3" d="M180 0v78m-24-24h48M965 0v70m-22-22h44"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Moonhalftone screened ink disk</title>
  <desc id="desc">An original circular manga screentone motif with a dense center fading toward an open paper edge.</desc>
  <defs>
    <pattern id="tone" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="currentColor" />
      <circle cx="6" cy="6" r="1.4" fill="currentColor" />
    </pattern>
    <radialGradient id="fade">
      <stop offset="0.44" stop-color="white" />
      <stop offset="0.78" stop-color="white" stop-opacity="0.88" />
      <stop offset="1" stop-color="white" stop-opacity="0" />
    </radialGradient>
    <mask id="screen-mask">
      <circle cx="64" cy="64" r="58" fill="url(#fade)" />
    </mask>
  </defs>
  <circle cx="64" cy="64" r="58" fill="url(#tone)" mask="url(#screen-mask)" />
  <circle cx="64" cy="64" r="57" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="1 4" />
</svg>

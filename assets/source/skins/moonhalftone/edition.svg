<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 64" role="img" aria-labelledby="title desc">
  <title id="title">Moonframe Moonhalftone edition</title>
  <desc id="desc">A compact monochrome edition badge with a screened ink disc, identifying Moonhalftone as a Moonframe visual edition.</desc>
  <defs>
    <pattern id="tone" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="currentColor" />
    </pattern>
    <mask id="disc">
      <circle cx="211" cy="32" r="21" fill="white" />
    </mask>
  </defs>
  <path d="M4 5h232v54H4z" fill="Canvas" stroke="currentColor" stroke-width="3" />
  <path d="M12 12h10v40H12z" fill="currentColor" />
  <text x="31" y="28" fill="currentColor" font-family="ui-monospace, monospace" font-size="10" font-weight="700" letter-spacing="1.5">MOONFRAME</text>
  <text x="31" y="44" fill="currentColor" font-family="ui-monospace, monospace" font-size="13" font-weight="800" letter-spacing="0.7">MOONHALFTONE</text>
  <circle cx="211" cy="32" r="21" fill="url(#tone)" mask="url(#disc)" />
  <circle cx="211" cy="32" r="21" fill="none" stroke="currentColor" stroke-width="2" />
</svg>

name: Validate Moonframe specification contracts
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  spec-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - name: Validate contract references, counts, statuses and Markdown links
        run: node scripts/validate-contracts.mjs
      - name: Run validator negative self-tests
        run: node scripts/validate-contracts.mjs --self-test
      - name: Prove bounded token fixture
        run: node scripts/token-subset-proof.mjs
      - name: Validate M13 cross-contract and 460-task handoff integrity
        run: node scripts/verify-m13-handoff.mjs
      - name: Syntax-check unattended Codex runner
        run: node --check scripts/run-m13-autopilot.mjs
      - name: Dry-run frozen autonomous queue (no Codex launch)
        run: node scripts/run-m13-autopilot.mjs --dry-run

  runtime-and-showcase:
    runs-on: ubuntu-latest
    needs: spec-contracts
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify deterministic token generator & CSS bridge
        run: pnpm run tokens
      - name: Run unit & SSR tests
        run: pnpm test
      - name: Run TypeScript typecheck
        run: pnpm run typecheck && pnpm --filter moonframe typecheck
      - name: Build Next.js moonframe showcase app
        run: pnpm run build
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run browser behavior, accessibility and skin capture tests
        run: pnpm run test:browser
      - name: Verify screenshot inventory and structural skin pair matrix
        run: pnpm run audit:pairs
      - name: Upload browser screenshots and diagnostic traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moonframe-visual-qa-${{ github.sha }}
          path: |
            artifacts/skins/
            artifacts/site/
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: warn
